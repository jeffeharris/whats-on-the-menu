services:
  db:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsonthemenu
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsonthemenu"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Cap container logs so they can't fill the host disk over time.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bound memory on this shared host so a runaway can't starve co-tenants.
    # Postgres idles ~15 MiB here; 256m leaves generous headroom. shm_size
    # backs Postgres shared memory (sorts/hash joins) — the 64m default is tight.
    mem_limit: 256m
    shm_size: 64m
    networks:
      - internal

  menu-app:
    image: ${MENU_IMAGE:-ghcr.io/jeffeharris/whats-on-the-menu:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN:-}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/whatsonthemenu
      - RESEND_API_KEY=${RESEND_API_KEY}
      - APP_URL=https://whatsonthemenu.app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Cap container logs so they can't fill the host disk over time.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bound memory on this shared host so a runaway can't starve co-tenants.
    # The Node/tsx server idles ~38 MiB; 256m leaves ~6x headroom.
    mem_limit: 256m
    networks:
      - web
      - internal

volumes:
  pgdata:

networks:
  web:
    external: true
  internal:
    driver: bridge
